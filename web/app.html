<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Math Geometry｜几何模型专项练习</title>
<style>
:root{font:16px system-ui;color:#182640;background:#edf3f9}*{box-sizing:border-box}body{margin:auto;max-width:1100px;padding:16px}header,section,aside,main{background:white;border:1px solid #cedbeb;border-radius:12px;padding:16px;margin-bottom:12px}h1,h2{margin:.25em 0 .6em}p{line-height:1.6}button,input,select{font:inherit;padding:.55em;border:1px solid #6d819e;border-radius:6px;margin:.2em;max-width:100%;color:inherit;background:white}button{cursor:pointer}button:hover{background:#e5efff}.skip{position:absolute;left:16px;top:8px;background:white;padding:.5em;transform:translateY(-200%)}.skip:focus{transform:none}:focus-visible{outline:3px solid #1755b8;outline-offset:2px}svg{display:block;max-width:100%;width:420px;height:auto}label{display:block}fieldset{border:0;padding:0}#practice{display:grid;grid-template-columns:minmax(220px,1fr) minmax(0,3fr);gap:12px}#avatar{display:inline-grid;place-items:center;width:2em;height:2em;color:white;border-radius:50%;margin-right:.5em}#chapters button{display:block;width:100%;text-align:left}[hidden]{display:none!important}#feedback{font-weight:bold}#summary{font-variant-numeric:tabular-nums}@media(max-width:650px){#practice{grid-template-columns:1fr}body{padding:8px}}@media print{header,aside,button,input,select,#session,#feedback{display:none!important}#practice{display:block}main{border:0}}
</style>
<a class="skip" href="#problem">跳到练习</a><header><h1>Math Geometry</h1><p>数学几何模型专项练习 · 12 个专题 · 5000 道题</p><p>公开练习版 · 部分细分题型和图形仍在审校</p></header>
<section id="login">
<h2>本地虚拟账户</h2>
<p>账户和进度仅保存在当前浏览器，无法自动跨设备同步。请勿复用真实账户密码或保存敏感信息。</p>
<form id="credentials"><label>用户名 <input id="username" autocomplete="username" required maxlength="40"></label><label>密码 <input id="password" type="password" autocomplete="current-password" required></label><label>确认密码（注册时填写） <input id="confirmPassword" type="password" autocomplete="new-password"></label><label>头像颜色（注册时可选） <input id="avatarColor" type="color" value="#2457a6"></label><button id="signIn">登录</button><button type="submit" id="register">注册</button></form>
<p id="authMessage" role="status"></p>
</section>
<div id="workspace" hidden>
<section id="session"><span id="avatar" aria-hidden="true"></span><strong id="who"></strong><p id="summary"></p><button id="logout">退出 / 切换账户</button><button id="download">导出记录</button><button id="upload">导入记录</button><input id="uploadFile" type="file" accept=".json,application/json" hidden><button id="clear">清空记录</button><button id="remove">删除账户</button></section>
<div id="practice">
<aside><h2>专题目录</h2><details><summary>展开章节</summary><div id="chapters"></div></details><label>专题 <select id="category"><option value="">全部专题</option></select></label><label>难度 <select id="level"><option value="">全部难度</option><option>基础</option><option>提高</option><option>挑战</option></select></label><label>按状态查看 <select id="filter"><option value="">全部</option><option value="wrong">错题本</option><option value="favorite">收藏</option><option value="mastered">已掌握</option><option value="new">未完成</option></select></label><label>题号或关键词 <input id="search" type="search"></label><p id="matches"></p><details><summary>公式与解题提示</summary><p id="formula"></p></details><button id="random">随机出题</button><button id="resume">继续练习</button></aside>
<main><p id="empty" hidden>没有符合条件的题目。</p>
<div id="problem" tabindex="-1"><h2 id="title" tabindex="-1"></h2><p id="problemStatus" role="status"></p><p id="prompt"></p><div id="drawing"></div><form id="response"><label>答案 <input id="entry" autocomplete="off"></label><button>批改</button></form><p id="feedback" role="status"></p><button id="previous">上一题</button><button id="next">下一题</button><button id="favorite"></button><button id="mastered"></button><button id="print">打印 / 导出 PDF</button><details id="solution"><summary>查看答案</summary><p id="result"></p><ol id="steps"></ol><div id="solutionSvg"></div></details></div></main>
</div></div>
