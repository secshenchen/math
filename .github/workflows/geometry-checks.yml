name: Geometry checks
on:
  push:
    branches: [main, feature/geometry-5000-independent-svg]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
      - run: python3 build.py
      - run: python3 tools/package_candidate.py && cmp index.html candidate/offline.html
      - run: python3 -m unittest discover -s tests -v
      - run: node --check web/app.js && node tests/test_grading.cjs
      - run: npm install --no-save --package-lock=false playwright@1.58.2
      - run: npx playwright install --with-deps chromium webkit
      - run: node tests/svg_layout.cjs
      - run: node tests/browser.cjs
      - run: node tests/browser.cjs
        env:
          GEOMETRY_BROWSER: webkit
          GEOMETRY_DEVICE: iPhone 13
      - run: node tests/browser.cjs
        env:
          GEOMETRY_BROWSER: webkit
          GEOMETRY_DEVICE: iPad (gen 7)
